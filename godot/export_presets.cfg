html/head_include="<style>\n#rotate{display:none;position:fixed;inset:0;z-index:10;background:#12110f;color:#f3efe6;font:500 17px/1.4 system-ui,sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px}\n@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}\n</style>\n<script>\n// Artifact hosting serves a fixed set of file types, at most 15 MB each:\n// the engine ships gzipped and both binaries are renamed. Map the loader's\n// requests to them, inflating the engine in the browser.\n(function () {\n  var original = window.fetch;\n  var renamed = { 'index.wasm': ['engine.gz.wasm', true], 'index.pck': ['game.pck.wasm', false] };\n  window.fetch = function (input, init) {\n    var url = typeof input === 'string' ? input : input.url;\n    var name = url.split('?')[0].split('/').pop();\n    var to = renamed[name];\n    if (!to) return original(input, init);\n    return original(url.replace(name, to[0]), init).then(function (r) {\n      if (!r.ok || !to[1]) return r;\n      var body = r.body.pipeThrough(new DecompressionStream('gzip'));\n      return new Response(body, { headers: { 'Content-Type': 'application/wasm' } });\n    });\n  };\n  document.addEventListener('DOMContentLoaded', function () {\n    var d = document.createElement('div');\n    d.id = 'rotate';\n    d.textContent = 'Turn your phone sideways to climb.';\n    document.body.appendChild(d);\n  });\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

